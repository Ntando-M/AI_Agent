<div class="dialog-backdrop" (click)="cancel.emit()">
  <div class="dialog-container" role="dialog" aria-modal="true" [attr.aria-label]="title"
       (click)="$event.stopPropagation()">
    <h2 class="dialog-title">{{ title }}</h2>
    <p class="dialog-message">{{ message }}</p>
    <div class="dialog-actions">
      <button class="btn-cancel" (click)="cancel.emit()">{{ cancelLabel }}</button>
      <button class="btn-confirm" [class.danger]="danger" (click)="confirm.emit()">
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
